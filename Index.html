<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>City Roam</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; font-family: Arial; background: #87ceeb; }
canvas { display: block; }
#title {
  position: absolute; top: 15px; left: 15px;
  color: white; font-size: 23px; font-weight: bold;
  text-shadow: 2px 2px 4px black;
}
#controls {
  position: absolute; bottom: 25px; left: 20px;
  display: grid; grid-template-columns: 55px 55px 55px;
  gap: 5px;
}
button {
  width: 55px; height: 55px; border: 0;
  border-radius: 12px; background: #222a;
  color: white; font-size: 22px;
}
</style>
</head>
<body>

<div id="title">CITY ROAM</div>

<div id="controls">
  <span></span><button data-move="forward">▲</button><span></span>
  <button data-move="left">◀</button>
  <button data-move="backward">▼</button>
  <button data-move="right">▶</button>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(
  70, window.innerWidth / window.innerHeight, 0.1, 1000
);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x555555, 2));

const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.position.set(20, 40, 20);
scene.add(sun);

// Ground
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(300, 300),
  new THREE.MeshStandardMaterial({color:0x477b45})
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// Roads
function road(x, z, w, h) {
  const r = new THREE.Mesh(
    new THREE.PlaneGeometry(w, h),
    new THREE.MeshStandardMaterial({color:0x333333})
  );
  r.rotation.x = -Math.PI / 2;
  r.position.set(x, 0.02, z);
  scene.add(r);
}
road(0, 0, 300, 18);
road(0, 0, 18, 300);

// Buildings
for (let x = -80; x <= 80; x += 25) {
  for (let z = -80; z <= 80; z += 25) {
    if (Math.abs(x) < 15 || Math.abs(z) < 15) continue;

    const height = 10 + Math.random() * 30;
    const building = new THREE.Mesh(
      new THREE.BoxGeometry(12, height, 12),
      new THREE.MeshStandardMaterial({
        color: new THREE.Color().setHSL(
          0.55 + Math.random() * 0.15, 0.2, 0.4 + Math.random() * 0.3
        )
      })
    );

    building.position.set(x, height / 2, z);
    scene.add(building);
  }
}

// Player
const player = new THREE.Mesh(
  new THREE.CapsuleGeometry(0.7, 1.2, 4, 8),
  new THREE.MeshStandardMaterial({color:0x1565ff})
);
player.position.set(0, 1.3, 0);
scene.add(player);

camera.position.set(0, 7, 12);

const keys = {};
const movement = {};
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

document.querySelectorAll('[data-move]').forEach(button => {
  const direction = button.dataset.move;
  button.addEventListener('pointerdown', e => {
    e.preventDefault();
    movement[direction] = true;
  });
  ['pointerup','pointerleave','pointercancel'].forEach(event => {
    button.addEventListener(event, () => movement[direction] = false);
  });
});

function animate() {
  requestAnimationFrame(animate);

  const speed = 0.15;
  if (keys.w || keys.arrowup || movement.forward) player.position.z -= speed;
  if (keys.s || keys.arrowdown || movement.backward) player.position.z += speed;
  if (keys.a || keys.arrowleft || movement.left) player.position.x -= speed;
  if (keys.d || keys.arrowright || movement.right) player.position.x += speed;

  camera.position.x += (player.position.x - camera.position.x) * 0.08;
  camera.position.z += (player.position.z + 12 - camera.position.z) * 0.08;
  camera.lookAt(player.position);

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
